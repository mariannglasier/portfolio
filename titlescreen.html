<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mariann Glasier | CS + Design @ GT</title>
        <link rel="icon" type="image/jpg" href="images/favicon.jpg">
        <link rel="stylesheet" href="titlescreen-style.css">
    </head>
    <body>
        <main class="title-screen" aria-label="Portfolio title screen">
            <video class="ambient-background" autoplay muted loop playsinline aria-hidden="true">
                <source src="images/homescreen/title_screen.mp4" type="video/mp4">
            </video>
            <audio class="title-audio" src="sounds/title_screen.mp3" loop preload="auto"></audio>
            <audio class="click-audio" src="sounds/click!.wav" preload="auto"></audio>
            <button class="sound-button" type="button" hidden>Enable sound</button>
            <a class="title-screen-link" href="home.html" aria-label="Enter portfolio">
                <div class="title-lockup">
                    <img class="title-card" src="images/homescreen/title_card.png" alt="Mariann's Life">
                    <div class="click-letters" aria-label="Click">
                        <img src="images/homescreen/click!/c.png" alt="">
                        <img src="images/homescreen/click!/l.png" alt="">
                        <img src="images/homescreen/click!/i.png" alt="">
                        <img src="images/homescreen/click!/c_lowercase.png" alt="">
                        <img src="images/homescreen/click!/k.png" alt="">
                        <img src="images/homescreen/click!/!.png" alt="">
                    </div>
                </div>
            </a>
        </main>
        <script src="titlescreen.js"></script>
    </body>
</html>
